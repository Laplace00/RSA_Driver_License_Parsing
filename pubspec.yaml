name: rsa_driver_license_parsing
description: A Flutter library for decrypting and parsing South African driver's license data from PDF417 barcodes. Supports both v1 and v2 license formats.
version: 1.0.1
homepage: https://github.com/Laplace00/RSA_Driver_License_Parsing
repository: https://github.com/Laplace00/RSA_Driver_License_Parsing
issue_tracker: https://github.com/Laplace00/RSA_Driver_License_Parsing/issues

topics:
  - south-africa
  - drivers-license
  - pdf417
  - barcode
  - parsing

environment:
  sdk: ">=3.3.1 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  pointycastle: ^3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
